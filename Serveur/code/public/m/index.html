<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0d14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JMH">
<title>JMH</title>
<link rel="manifest" href="/m/manifest.webmanifest">
<link rel="apple-touch-icon" href="/assets/jmh-app-512.png">
<link rel="icon" href="/assets/jmh-app-192.png">
<link rel="stylesheet" href="/m/app.css">
</head>
<body>
<div id="login" class="screen login" hidden>
  <div class="login-card">
    <img src="/assets/jmh-app-192.png" alt="" class="login-logo">
    <h1>JMH</h1>
    <p class="muted">Ton univers, partout.</p>
    <form id="loginForm" autocomplete="on">
      <input id="username" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" placeholder="Identifiant" required>
      <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Mot de passe" required>
      <button type="submit" class="primary">Se connecter</button>
      <p id="loginError" class="error" role="alert"></p>
    </form>
  </div>
</div>

<div id="app" hidden>
  <header class="topbar">
    <button id="backButton" class="icon-button" aria-label="Retour" hidden>‹</button>
    <h1 id="title">Accueil</h1>
    <button id="accountButton" class="icon-button" aria-label="Mon compte">●</button>
  </header>
  <main id="view" class="view"></main>

  <div id="miniPlayer" class="mini-player" hidden>
    <img id="miniCover" alt="">
    <div class="mini-text"><strong id="miniTitle"></strong><span id="miniArtist"></span></div>
    <button id="miniToggle" class="icon-button" aria-label="Lecture ou pause">❚❚</button>
    <button id="miniNext" class="icon-button" aria-label="Morceau suivant">›</button>
  </div>
  <audio id="audio" preload="none"></audio>

  <nav class="tabbar" aria-label="Navigation principale">
    <button data-tab="home" class="active"><span class="tab-icon">⌂</span>Accueil</button>
    <button data-tab="files"><span class="tab-icon">▤</span>Fichiers</button>
    <button data-tab="cinema"><span class="tab-icon">▶</span>Films</button>
    <button data-tab="music"><span class="tab-icon">♪</span>Musique</button>
    <button data-tab="photos"><span class="tab-icon">▣</span>Photos</button>
  </nav>
</div>

<div id="player" class="player" hidden>
  <div class="player-bar">
    <button id="playerClose" class="icon-button" aria-label="Fermer">✕</button>
    <strong id="playerTitle"></strong>
  </div>
  <video id="video" playsinline controls preload="metadata"></video>
  <p id="playerStatus" class="player-status"></p>
  <div class="player-options">
    <button data-quality="original" class="chip">Original</button>
    <button data-quality="720" class="chip active">4G (720p)</button>
    <button data-quality="1080" class="chip">HD (1080p)</button>
  </div>
</div>

<div id="viewer" class="viewer" hidden>
  <button id="viewerClose" class="icon-button" aria-label="Fermer">✕</button>
  <img id="viewerImage" alt="">
  <video id="viewerVideo" playsinline controls hidden></video>
  <p id="viewerCaption"></p>
</div>
<script src="/m/app.js"></script>
</body>
</html>
