name: Construire le serveur Docker
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/jmh95200-workspace-server:latest
            ghcr.io/${{ github.repository_owner }}/jmh95200-workspace-server:6.0.0-alpha.1
